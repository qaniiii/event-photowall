<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Photo Wall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip & FileSaver CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-24">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="resetToJoin()">
        <span class="text-2xl">📸</span>
        <h1 class="text-lg font-bold tracking-tight text-white">Event Photo Wall</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="projectorBtn" class="hidden text-xs bg-indigo-950/60 hover:bg-indigo-900 border border-indigo-800/60 text-indigo-300 px-3 py-1.5 rounded-lg transition">
          📽️ Projector Mode
        </button>
        <button id="leaveBtn" class="hidden text-xs text-slate-400 hover:text-white transition">
          Exit Room
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- 1. Join Event Section -->
    <section id="joinSection" class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-4">
      <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
        🎉
      </div>
      <h2 class="text-xl font-bold">Join an Event</h2>
      <p class="text-xs text-slate-400">Enter the access code provided by your event organizer</p>
      
      <form id="joinForm" class="space-y-3 pt-2">
        <input type="text" id="accessCodeInput" required placeholder="e.g. WED123" uppercase
          class="w-full text-center tracking-widest uppercase font-mono font-bold text-lg bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm py-3 rounded-xl transition duration-150 shadow-lg">
          Enter Photo Wall
        </button>
      </form>
    </section>

    <!-- 2. Event Gallery View -->
    <div id="eventSection" class="hidden space-y-8">
      
      <!-- Event Header Banner -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
        <div>
          <span class="text-xs font-mono font-bold bg-indigo-500/20 text-indigo-400 px-2.5 py-1 rounded-md tracking-wider">ROOM CODE: <span id="eventBadgeCode"></span></span>
          <h2 id="eventTitleDisplay" class="text-2xl font-extrabold text-white mt-2"></h2>
          <p id="eventMetaDisplay" class="text-xs text-slate-400 mt-0.5"></p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="downloadAllZip()" id="zipAllBtn"
            class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-2.5 rounded-xl transition">
            📦 Download All (.zip)
          </button>
          <button onclick="document.getElementById('uploadDrawer').scrollIntoView({behavior: 'smooth'})"
            class="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg transition">
            + Share Photos
          </button>
        </div>
      </div>

      <!-- Upload Form Drawer -->
      <section id="uploadDrawer" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2">
          <span>📤</span> Upload Photos (Select up to 5)
        </h3>
        <form id="uploadForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Your Name</label>
              <input type="text" id="uploaderName" placeholder="Anonymous"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Caption / Message</label>
              <input type="text" id="captionInput" placeholder="Wishing you the best!"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Select Photo(s)</label>
            <input type="file" id="fileInput" accept="image/*" multiple required
              class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-indigo-400 hover:file:bg-slate-700 cursor-pointer" />
          </div>
          <button type="submit" id="submitUploadBtn"
            class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm py-2.5 rounded-xl transition duration-150 shadow-lg">
            Upload to Wall
          </button>
        </form>
      </section>

      <!-- Photos Masonry Grid & Controls -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <h3 class="text-sm font-semibold text-slate-300">Live Gallery (<span id="photoCountDisplay">0</span>)</h3>
            <button id="toggleSelectModeBtn" onclick="toggleSelectMode()"
              class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-300">
              ☑️ Select
            </button>
          </div>
          <button onclick="refreshCurrentEvent()" class="text-xs text-slate-400 hover:text-white transition">
            🔄 Refresh
          </button>
        </div>
        <div id="photosGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <!-- Populated by JS -->
        </div>
      </section>

    </div>

  </main>

  <!-- Sticky Bottom Floating Action Bar for Selected Photos -->
  <div id="selectionBar" class="hidden fixed bottom-4 inset-x-0 max-w-md mx-auto z-40 px-4">
    <div class="bg-indigo-900/90 border border-indigo-700/80 backdrop-blur-md rounded-2xl p-3 shadow-2xl flex items-center justify-between">
      <span class="text-xs text-indigo-200 font-medium pl-2"><span id="selectedCountText">0</span> photos selected</span>
      <div class="flex items-center gap-2">
        <button onclick="cancelSelection()" class="text-xs text-slate-300 hover:text-white px-2 py-1">Cancel</button>
        <button onclick="downloadSelectedZip()" id="downloadSelectedBtn" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-3 py-1.5 rounded-xl text-white shadow">
          Download ZIP
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentCode = "";
    let currentPhotos = [];
    let isSelectMode = false;
    let selectedPhotoIds = new Set();

    const joinSection = document.getElementById("joinSection");
    const eventSection = document.getElementById("eventSection");
    const joinForm = document.getElementById("joinForm");
    const accessCodeInput = document.getElementById("accessCodeInput");
    const leaveBtn = document.getElementById("leaveBtn");
    const projectorBtn = document.getElementById("projectorBtn");
    const uploadForm = document.getElementById("uploadForm");
    const submitUploadBtn = document.getElementById("submitUploadBtn");
    const selectionBar = document.getElementById("selectionBar");

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const codeFromUrl = params.get("code");
      if (codeFromUrl) {
        accessCodeInput.value = codeFromUrl;
        joinEvent(codeFromUrl);
      }
    });

    joinForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const code = accessCodeInput.value.trim().toUpperCase();
      if (code) joinEvent(code);
    });

    leaveBtn.addEventListener("click", resetToJoin);

    projectorBtn.addEventListener("click", () => {
      if (currentCode) {
        window.open(`/slideshow.html?code=${currentCode}`, '_blank');
      }
    });

    function resetToJoin() {
      currentCode = "";
      currentPhotos = [];
      cancelSelection();
      window.history.replaceState({}, document.title, window.location.pathname);
      eventSection.classList.add("hidden");
      leaveBtn.classList.add("hidden");
      projectorBtn.classList.add("hidden");
      joinSection.classList.remove("hidden");
      accessCodeInput.value = "";
    }

    async function joinEvent(code) {
      try {
        const res = await fetch(`/events/${code}`);
        if (!res.ok) {
          alert("Event not found. Please check your access code.");
          return;
        }
        const data = await res.json();
        currentCode = data.access_code;
        currentPhotos = data.photos || [];

        document.getElementById("eventBadgeCode").textContent = data.access_code;
        document.getElementById("eventTitleDisplay").textContent = data.title;
        document.getElementById("eventMetaDisplay").textContent = `Created ${new Date(data.created_at).toLocaleDateString()}`;

        renderPhotos(currentPhotos);

        joinSection.classList.add("hidden");
        eventSection.classList.remove("hidden");
        leaveBtn.classList.remove("hidden");
        projectorBtn.classList.remove("hidden");
      } catch (err) {
        alert("Error connecting to event: " + err.message);
      }
    }

    async function refreshCurrentEvent() {
      if (!currentCode) return;
      try {
        const res = await fetch(`/events/${currentCode}`);
        if (res.ok) {
          const data = await res.json();
          currentPhotos = data.photos || [];
          renderPhotos(currentPhotos);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      selectedPhotoIds.clear();
      updateSelectionUI();
      renderPhotos(currentPhotos);
      document.getElementById("toggleSelectModeBtn").textContent = isSelectMode ? "Done" : "☑️ Select";
    }

    function cancelSelection() {
      isSelectMode = false;
      selectedPhotoIds.clear();
      updateSelectionUI();
      renderPhotos(currentPhotos);
      document.getElementById("toggleSelectModeBtn").textContent = "☑️ Select";
    }

    function togglePhotoSelect(id) {
      if (selectedPhotoIds.has(id)) {
        selectedPhotoIds.delete(id);
      } else {
        selectedPhotoIds.add(id);
      }
      updateSelectionUI();
      renderPhotos(currentPhotos);
    }

    function updateSelectionUI() {
      const count = selectedPhotoIds.size;
      document.getElementById("selectedCountText").textContent = count;
      if (isSelectMode && count > 0) {
        selectionBar.classList.remove("hidden");
      } else {
        selectionBar.classList.add("hidden");
      }
    }

    function renderPhotos(photos) {
      const grid = document.getElementById("photosGrid");
      document.getElementById("photoCountDisplay").textContent = photos.length;

      if (!photos || photos.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-sm text-slate-500 border border-dashed border-slate-800 rounded-2xl">No photos yet! Be the first to add one above.</div>`;
        return;
      }

      const sorted = [...photos].reverse();
      grid.innerHTML = sorted.map(p => {
        const isSelected = selectedPhotoIds.has(p.id);
        return `
          <div class="relative bg-slate-900 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : 'border-slate-800'} rounded-2xl overflow-hidden shadow-lg flex flex-col transition hover:border-slate-700 cursor-pointer"
               onclick="${isSelectMode ? `togglePhotoSelect(${p.id})` : ''}">
            
            ${isSelectMode ? `
              <div class="absolute top-2 left-2 z-10">
                <input type="checkbox" ${isSelected ? 'checked' : ''} class="w-5 h-5 rounded text-indigo-600 focus:ring-0 pointer-events-none" />
              </div>
            ` : ''}

            <div class="aspect-square bg-slate-950 overflow-hidden relative">
              <img src="${p.image_url}" class="w-full h-full object-cover transition duration-300 hover:scale-105" loading="lazy" />
              <!-- Direct individual download icon -->
              <a href="${p.image_url}" target="_blank" download="photo-${p.id}.jpg" onclick="event.stopPropagation()"
                class="absolute bottom-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-slate-300 p-2 rounded-xl text-xs backdrop-blur border border-white/10 shadow">
                ⬇️
              </a>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between">
              <p class="text-sm text-slate-200">${p.caption || '<span class="italic text-slate-500">No caption</span>'}</p>
              <div class="mt-3 flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-800/80 pt-2">
                <span class="font-medium text-indigo-400">By ${p.uploader_name}</span>
                <span>${p.uploaded_at ? new Date(p.uploaded_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Helper: Download a list of photos into a ZIP
    async function packageAndSaveZip(targetPhotos, filename) {
      if (!targetPhotos || targetPhotos.length === 0) {
        alert("No photos to download!");
        return;
      }

      const zip = new JSZip();
      const folder = zip.folder(currentCode || "photos");

      for (let i = 0; i < targetPhotos.length; i++) {
        const photo = targetPhotos[i];
        try {
          const resp = await fetch(photo.image_url);
          const blob = await resp.blob();
          const cleanName = (photo.uploader_name || "photo").replace(/[^a-zA-Z0-9]/g, "_");
          folder.file(`${i + 1}_${cleanName}_${photo.id}.jpg`, blob);
        } catch (e) {
          console.error("Failed to bundle image:", photo.image_url, e);
        }
      }

      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, filename);
    }

    // Bulk Download All
    async function downloadAllZip() {
      const btn = document.getElementById("zipAllBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Packing ZIP...";

      try {
        await packageAndSaveZip(currentPhotos, `${currentCode}_all_photos.zip`);
      } catch (err) {
        alert("Download failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // Download Selected
    async function downloadSelectedZip() {
      const btn = document.getElementById("downloadSelectedBtn");
      btn.disabled = true;
      btn.textContent = "Generating...";

      const selected = currentPhotos.filter(p => selectedPhotoIds.has(p.id));
      try {
        await packageAndSaveZip(selected, `${currentCode}_selected_photos.zip`);
        cancelSelection();
      } catch (err) {
        alert("Failed to download selected photos: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Download ZIP";
      }
    }

    // Batch Upload Handler
    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("fileInput");
      const files = fileInput.files;

      if (!files || files.length === 0) return;

      const formData = new FormData();
      for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
      }
      formData.append("uploader_name", document.getElementById("uploaderName").value);
      formData.append("caption", document.getElementById("captionInput").value);

      submitUploadBtn.disabled = true;
      submitUploadBtn.textContent = `Uploading ${files.length} photo(s)...`;

      try {
        const res = await fetch(`/events/${currentCode}/photos/batch`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          const err = await res.json();
          alert(`Upload failed: ${err.detail || 'Error uploading'}`);
        } else {
          uploadForm.reset();
          await refreshCurrentEvent();
        }
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        submitUploadBtn.disabled = false;
        submitUploadBtn.textContent = "Upload to Wall";
      }
    });
  </script>
</body>
</html>
