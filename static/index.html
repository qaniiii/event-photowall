<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Photo Wall</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-800" id="eventTitle">Event Photo Wall</h1>
      <p class="text-slate-500 text-sm mt-1" id="eventSubtitle">Enter an access code to join an album</p>
    </header>

    <!-- Step 1: Enter Access Code -->
    <section id="codeSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-md mx-auto mb-8">
      <form id="codeForm" class="flex gap-2">
        <input 
          type="text" 
          id="accessCodeInput" 
          placeholder="e.g. WED123" 
          required 
          class="flex-1 px-4 py-2 border border-slate-300 rounded-lg uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button 
          type="submit" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg transition"
        >
          Join
        </button>
      </form>
    </section>

    <!-- Step 2: Upload Area (Hidden until valid event loaded) -->
    <section id="uploadSection" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Share a Photo</h2>
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Your Name</label>
          <input 
            type="text" 
            id="uploaderName" 
            placeholder="Guest" 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Caption</label>
          <input 
            type="text" 
            id="caption" 
            placeholder="Write a message..." 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Select Photo</label>
          <input 
            type="file" 
            id="fileInput" 
            accept="image/*" 
            required 
            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
          />
        </div>
        <button 
          type="submit" 
          id="uploadBtn" 
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm"
        >
          Upload to Gallery
        </button>
      </form>
    </section>

    <!-- Step 3: Photo Gallery Grid -->
    <section id="gallerySection" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-800">Gallery</h2>
        <button id="refreshBtn" class="text-xs text-indigo-600 hover:underline">Refresh photos</button>
      </div>
      <div id="photosGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>
  </div>

  <script>
    let currentCode = "";

    const codeForm = document.getElementById("codeForm");
    const accessCodeInput = document.getElementById("accessCodeInput");
    const codeSection = document.getElementById("codeSection");
    const uploadSection = document.getElementById("uploadSection");
    const gallerySection = document.getElementById("gallerySection");
    const eventTitle = document.getElementById("eventTitle");
    const eventSubtitle = document.getElementById("eventSubtitle");
    const photosGrid = document.getElementById("photosGrid");
    const uploadForm = document.getElementById("uploadForm");
    const uploadBtn = document.getElementById("uploadBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    async function loadEvent(code) {
      try {
        const res = await fetch(`/events/${code.trim().toUpperCase()}`);
        if (!res.ok) {
          alert("Event not found. Make sure the code exists!");
          return;
        }
        const data = await res.json();
        currentCode = data.access_code;

        eventTitle.textContent = data.title;
        eventSubtitle.textContent = `Event Code: ${data.access_code}`;
        uploadSection.classList.remove("hidden");
        gallerySection.classList.remove("hidden");
        codeSection.classList.add("hidden");

        renderPhotos(data.photos);
      } catch (err) {
        console.error(err);
        alert("Failed to load event.");
      }
    }

    function renderPhotos(photos) {
      photosGrid.innerHTML = "";
      if (photos.length === 0) {
        photosGrid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-8">No photos uploaded yet. Be the first!</p>`;
        return;
      }
      photos.slice().reverse().forEach(photo => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col";
        card.innerHTML = `
          <a href="${photo.image_url}" target="_blank" rel="noopener noreferrer">
            <img src="${photo.image_url}" alt="${photo.caption || 'Photo'}" class="w-full h-48 object-cover hover:opacity-95 transition" loading="lazy" />
          </a>
          <div class="p-3 text-xs flex flex-col justify-between flex-1">
            <p class="text-slate-800 font-medium mb-1">${photo.caption || ""}</p>
            <div class="flex justify-between items-center text-slate-400 pt-2 border-t border-slate-100">
              <span>By ${photo.uploader_name || "Guest"}</span>
              <span>${new Date(photo.uploaded_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
          </div>
        `;
        photosGrid.appendChild(card);
      });
    }

    codeForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loadEvent(accessCodeInput.value);
    });

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      const uploaderName = document.getElementById("uploaderName").value || "Guest";
      const caption = document.getElementById("caption").value || "";

      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("uploader_name", uploaderName);
      formData.append("caption", caption);

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";

      try {
        const res = await fetch(`/events/${currentCode}/photos/`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) throw new Error("Upload failed");
        
        uploadForm.reset();
        await loadEvent(currentCode);
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload to Gallery";
      }
    });

    refreshBtn.addEventListener("click", () => loadEvent(currentCode));
  </script>
</body>
</html>
